AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Ambiente de desenvolvimento em uma EC2 com Docker Compose. O template antigo
  cloudformation.yml (Docker Swarm) permanece inalterado.

Parameters:
  ProjectName:
    Type: String
    Default: studio-many
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9-]{1,30}$"
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging]
  ImageId:
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: "/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id"
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large]
    Description: t3.medium recomendado para MySQL, WAHA e os dois serviços Java.
  DockerHubUser:
    Type: String
    Default: billhebertpdc
    AllowedPattern: "^[a-z0-9][a-z0-9_-]{0,29}$"
  ImageTag:
    Type: String
    Default: latest
    AllowedPattern: "^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$"
    Description: Tag publicada para as três imagens da aplicação.
  AdminCidr:
    Type: String
    MinLength: 9
    Description: >-
      CIDR autorizado a acessar os painéis WAHA (3000) e RabbitMQ (15672).
      Informe o seu IP público, ex.: 203.0.113.10/32.

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.30.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-igw"

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.30.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-public"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # IP público fixo: mantém CORS (FRONTEND_ORIGIN) e URLs estáveis entre stop/start.
  ElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-eip"

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref AppInstance

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Acesso ao ${ProjectName} Compose"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: !Ref AdminCidr
        - IpProtocol: tcp
          FromPort: 15672
          ToPort: 15672
          CidrIp: !Ref AdminCidr
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-sg"

  SsmInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-ssm-role"

  SsmInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref SsmInstanceRole

  AppInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - PublicRoute
      - PublicSubnetRouteTableAssociation
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref SsmInstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 40
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -Eeuo pipefail
          exec > >(tee -a /var/log/studio-many-bootstrap.log | logger -t studio-many-bootstrap -s 2>/dev/console) 2>&1

          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y ca-certificates curl openssl

          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          cat > /etc/apt/sources.list.d/docker.sources <<DOCKER_REPO
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: $(. /etc/os-release && printf '%s' "$VERSION_CODENAME")
          Components: stable
          Architectures: $(dpkg --print-architecture)
          Signed-By: /etc/apt/keyrings/docker.asc
          DOCKER_REPO
          apt-get update -y
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          systemctl enable --now docker

          install -d -m 0700 /opt/studio-many
          cd /opt/studio-many
          MYSQL_ROOT_PASSWORD="$(openssl rand -hex 32)"
          MYSQL_PASSWORD="$(openssl rand -hex 32)"
          RABBITMQ_PASSWORD="$(openssl rand -hex 32)"
          WAHA_API_KEY="$(openssl rand -hex 32)"
          WAHA_DASHBOARD_PASSWORD="$(openssl rand -hex 24)"
          JWT_SECRET="$(openssl rand -base64 32 | tr -d '\n')"
          cat > .env <<ENV_FILE
          MYSQL_DATABASE=studiomanydb
          MYSQL_USER=studio_app
          MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
          MYSQL_PASSWORD=$MYSQL_PASSWORD
          RABBITMQ_USERNAME=studio_app
          RABBITMQ_PASSWORD=$RABBITMQ_PASSWORD
          WAHA_API_KEY=$WAHA_API_KEY
          WAHA_SESSION=default
          WAHA_DASHBOARD_USERNAME=admin
          WAHA_DASHBOARD_PASSWORD=$WAHA_DASHBOARD_PASSWORD
          JWT_SECRET=$JWT_SECRET
          FRONTEND_ORIGIN=http://${ElasticIp}
          ENV_FILE
          chmod 0600 .env

          cat > docker-compose.yml <<'COMPOSE_FILE'
          services:
            mysql:
              image: mysql:8.4
              restart: unless-stopped
              environment:
                MYSQL_ROOT_PASSWORD: ${!MYSQL_ROOT_PASSWORD}
                MYSQL_DATABASE: ${!MYSQL_DATABASE}
                MYSQL_USER: ${!MYSQL_USER}
                MYSQL_PASSWORD: ${!MYSQL_PASSWORD}
                TZ: America/Sao_Paulo
              volumes:
                - mysql_data:/var/lib/mysql
              healthcheck:
                test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
                interval: 10s
                timeout: 5s
                retries: 12
                start_period: 30s

            rabbitmq:
              image: rabbitmq:4-management
              restart: unless-stopped
              environment:
                RABBITMQ_DEFAULT_USER: ${!RABBITMQ_USERNAME}
                RABBITMQ_DEFAULT_PASS: ${!RABBITMQ_PASSWORD}
              ports:
                - "15672:15672"
              volumes:
                - rabbitmq_data:/var/lib/rabbitmq
              healthcheck:
                test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
                interval: 10s
                timeout: 5s
                retries: 5

            waha:
              image: devlikeapro/waha:latest
              restart: unless-stopped
              ports:
                - "3000:3000"
              environment:
                WHATSAPP_API_KEY: ${!WAHA_API_KEY}
                WHATSAPP_DEFAULT_ENGINE: NOWEB
                WHATSAPP_START_SESSION: ${!WAHA_SESSION}
                WHATSAPP_RESTART_ALL_SESSIONS: "True"
                WAHA_DASHBOARD_USERNAME: ${!WAHA_DASHBOARD_USERNAME}
                WAHA_DASHBOARD_PASSWORD: ${!WAHA_DASHBOARD_PASSWORD}
                WAHA_PRINT_QR: "False"
                TZ: America/Sao_Paulo
              volumes:
                - waha_instances:/app/.sessions

            studio-many-backend:
              image: ${DockerHubUser}/studio-many-backend:${ImageTag}
              restart: unless-stopped
              ports:
                - "8080:8080"
              environment:
                SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${!MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
                SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
                SPRING_DATASOURCE_USERNAME: ${!MYSQL_USER}
                SPRING_DATASOURCE_PASSWORD: ${!MYSQL_PASSWORD}
                SPRING_SQL_INIT_MODE: "always"
                SPRING_SQL_INIT_DATA_LOCATIONS: classpath:data-mysql.sql
                SPRING_H2_CONSOLE_ENABLED: "false"
                JWT_SECRET: ${!JWT_SECRET}
                JWT_VALIDITY: "3600"
                RABBITMQ_HOST: rabbitmq
                RABBITMQ_PORT: "5672"
                RABBITMQ_USERNAME: ${!RABBITMQ_USERNAME}
                RABBITMQ_PASSWORD: ${!RABBITMQ_PASSWORD}
                CORS_ALLOWEDORIGINS: ${!FRONTEND_ORIGIN}
              volumes:
                - backend_uploads:/app/uploads
              depends_on:
                mysql:
                  condition: service_healthy
                rabbitmq:
                  condition: service_healthy

            studio-many-actions-service:
              image: ${DockerHubUser}/studio-many-actions-service:${ImageTag}
              restart: unless-stopped
              environment:
                RABBITMQ_HOST: rabbitmq
                RABBITMQ_PORT: "5672"
                RABBITMQ_USERNAME: ${!RABBITMQ_USERNAME}
                RABBITMQ_PASSWORD: ${!RABBITMQ_PASSWORD}
                WAHA_API_URL: http://waha:3000
                WAHA_API_KEY: ${!WAHA_API_KEY}
                WAHA_SESSION: ${!WAHA_SESSION}
                WHATSAPP_PROVIDER: waha
              depends_on:
                rabbitmq:
                  condition: service_healthy
                waha:
                  condition: service_started

            studio-many-front:
              image: ${DockerHubUser}/studio-many-front:${ImageTag}
              restart: unless-stopped
              ports:
                - "80:80"
              depends_on:
                - studio-many-backend

          volumes:
            mysql_data:
            rabbitmq_data:
            waha_instances:
            backend_uploads:
          COMPOSE_FILE

          docker compose pull
          docker compose up -d --remove-orphans
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-compose"

Outputs:
  InstanceId:
    Description: EC2 instance running Docker Compose
    Value: !Ref AppInstance
  PublicIp:
    Description: Elastic IP fixo da instância (frontend e API)
    Value: !Ref ElasticIp
  FrontendUrl:
    Description: Frontend HTTP endpoint
    Value: !Sub "http://${ElasticIp}"
  BackendSwaggerUrl:
    Description: Backend Swagger UI
    Value: !Sub "http://${ElasticIp}:8080/swagger-ui/index.html"
  WahaDashboardUrl:
    Description: WAHA dashboard (restricted to AdminCidr)
    Value: !Sub "http://${ElasticIp}:3000"
  RabbitMqManagementUrl:
    Description: RabbitMQ management (restricted to AdminCidr)
    Value: !Sub "http://${ElasticIp}:15672"
