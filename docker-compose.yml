services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-studiomanydb}
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER no .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - studio-network

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Defina RABBITMQ_USERNAME no .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - studio-network

  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WAHA_PORT:-3000}:3000"
    environment:
      WHATSAPP_API_KEY: ${WAHA_API_KEY:?Defina WAHA_API_KEY no .env}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_START_SESSION: ${WAHA_SESSION:-default}
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?Defina WAHA_DASHBOARD_PASSWORD no .env}
      WAHA_PRINT_QR: ${WAHA_PRINT_QR:-true}
      TZ: America/Sao_Paulo
    volumes:
      - waha_instances:/app/.sessions
    networks:
      - studio-network

  studio-many-backend:
    image: ${DOCKERHUB_USER:-billhebertpdc}/studio-many-backend:${IMAGE_TAG:-local}
    build:
      context: ../studio-many-web-backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-studiomanydb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?Defina MYSQL_USER no .env}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
      SPRING_SQL_INIT_MODE: ${SPRING_SQL_INIT_MODE:-always}
      SPRING_SQL_INIT_DATA_LOCATIONS: ${SPRING_SQL_INIT_DATA_LOCATIONS:-classpath:data-mysql.sql}
      SPRING_H2_CONSOLE_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      JWT_VALIDITY: ${JWT_VALIDITY:-3600}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Defina RABBITMQ_USERNAME no .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no .env}
      CORS_ALLOWEDORIGINS: ${CORS_ALLOWEDORIGINS:-http://localhost:5174}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - studio-network

  studio-many-actions-service:
    image: ${DOCKERHUB_USER:-billhebertpdc}/studio-many-actions-service:${IMAGE_TAG:-local}
    build:
      context: ../studio-many-schedulling-actions-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Defina RABBITMQ_USERNAME no .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no .env}
      WAHA_API_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:?Defina WAHA_API_KEY no .env}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-waha}
    depends_on:
      rabbitmq:
        condition: service_healthy
      waha:
        condition: service_started
    networks:
      - studio-network

  studio-many-front:
    image: ${DOCKERHUB_USER:-billhebertpdc}/studio-many-front:${IMAGE_TAG:-local}
    build:
      context: ../Studio-Many-Front-end
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - studio-many-backend
    networks:
      - studio-network

volumes:
  mysql_data:
  rabbitmq_data:
  waha_instances:
  backend_uploads:

networks:
  studio-network:
    driver: bridge
